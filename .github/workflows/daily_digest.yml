name: Daily Protein Design SOTA Digest

on:
  schedule:
    # Runs daily at 07:00 UTC (08:00 AM in UTC+1)
    - cron: '0 7 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-send test digest (ignores duplicate filter)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets Configuration
        run: |
          echo "Verifying configured repository secrets..."
          MISSING=0
          if [ -z "${{ secrets.GMAIL_USER }}" ]; then
            echo "::error::GMAIL_USER secret is MISSING in GitHub Repository Secrets!"
            MISSING=1
          else
            echo "✅ GMAIL_USER secret detected"
          fi
          if [ -z "${{ secrets.GMAIL_APP_PASSWORD }}" ]; then
            echo "::error::GMAIL_APP_PASSWORD secret is MISSING in GitHub Repository Secrets!"
            MISSING=1
          else
            echo "✅ GMAIL_APP_PASSWORD secret detected"
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::warning::GEMINI_API_KEY secret is not set (fallback heuristic will be used)"
          else
            echo "✅ GEMINI_API_KEY secret detected"
          fi

          if [ "$MISSING" -eq 1 ]; then
            echo "❌ Missing required secrets. Please add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi


      - name: Run Protein Design SOTA Agent
        id: run_agent
        continue-on-error: true
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
        run: |
          echo "Running protein design agent..."
          python run_agent.py --send --force 2>&1 | tee agent_run.log

      - name: Publish Step Summary to GitHub Actions UI
        if: always()
        run: |
          echo "## 🧬 Protein SOTA Agent Execution Log" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f agent_run.log ]; then
            cat agent_run.log >> $GITHUB_STEP_SUMMARY
          elif [ -f logs/daily_agent.log ]; then
            cat logs/daily_agent.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No log found." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check Agent Result
        if: steps.run_agent.outcome != 'success'
        run: |
          echo "::error::Agent failed during execution. See execution log above in the Summary tab."
          exit 1



      - name: Commit updated paper history and reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_history.db reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update paper history & reports [skip ci]" && git push)

      - name: Upload HTML report and logs artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-html-report
          path: |
            reports/
            logs/
          retention-days: 14

