name: Daily Protein Design SOTA Digest

on:
  schedule:
    # Runs daily at 07:00 UTC (08:00 AM in UTC+1)
    - cron: '0 7 * * *'
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-send test digest (ignores duplicate filter)'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Secrets Configuration
        run: |
          echo "Verifying configured repository secrets..."
          if [ -z "${{ secrets.GMAIL_USER }}" ]; then
            echo "::error::GMAIL_USER secret is MISSING in GitHub Repository Secrets!"
          else
            echo "✅ GMAIL_USER secret detected"
          fi
          if [ -z "${{ secrets.GMAIL_APP_PASSWORD }}" ]; then
            echo "::error::GMAIL_APP_PASSWORD secret is MISSING in GitHub Repository Secrets!"
          else
            echo "✅ GMAIL_APP_PASSWORD secret detected"
          fi
          if [ -z "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "::warning::GEMINI_API_KEY secret is not set (fallback heuristic will be used)"
          else
            echo "✅ GEMINI_API_KEY secret detected"
          fi

      - name: Run Protein Design SOTA Agent

        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: "gemini-3.6-flash"
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "Running test run with --force..."
            python run_agent.py --send --force
          else
            echo "Running standard daily scheduled run..."
            python run_agent.py --send
          fi


      - name: Commit updated paper history and reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/paper_history.db reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update paper history & reports [skip ci]" && git push)

      - name: Upload HTML report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-html-report
          path: reports/
          retention-days: 14
